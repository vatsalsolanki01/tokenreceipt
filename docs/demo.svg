<text x="24" y="52" class="t"><tspan fill="#56d364">$</tspan></text><text x="40.9" y="52" class="t c0">n</text><text x="49.3" y="52" class="t c1">p</text><text x="57.7" y="52" class="t c2">x</text><text x="66.2" y="52" class="t c3"> </text><text x="74.6" y="52" class="t c4">a</text><text x="83.0" y="52" class="t c5">g</text><text x="91.4" y="52" class="t c6">e</text><text x="99.9" y="52" class="t c7">n</text><text x="108.3" y="52" class="t c8">t</text><text x="116.7" y="52" class="t c9">r</text><text x="125.2" y="52" class="t c10">e</text><text x="133.6" y="52" class="t c11">c</text><text x="142.0" y="52" class="t c12">e</text><text x="150.4" y="52" class="t c13">i</text><text x="158.9" y="52" class="t c14">p</text><text x="167.3" y="52" class="t c15">t</text><text x="175.7" y="52" class="t c16"> </text><text x="184.2" y="52" class="t c17">-</text><text x="192.6" y="52" class="t c18">-</text><text x="201.0" y="52" class="t c19">d</text><text x="209.5" y="52" class="t c20">e</text><text x="217.9" y="52" class="t c21">m</text><text x="226.3" y="52" class="t c22">o</text><text x="24" y="72" class="t l0" xml:space="preserve"></text><text x="24" y="92" class="t l1" xml:space="preserve"><tspan >  </tspan><tspan font-weight="700">agentreceipt</tspan><tspan > </tspan><tspan fill-opacity="0.6">· what your AI coding agents cost (API-equivalent)</tspan><tspan fill="#e3b341"> [DEMO DATA]</tspan></text><text x="24" y="112" class="t l2" xml:space="preserve"><tspan >  </tspan><tspan fill-opacity="0.6">Oct 20, 2026 – Nov 18, 2026 · 24 active days · 79 sessions · 6,034 requests</tspan></text><text x="24" y="132" class="t l3" xml:space="preserve"></text><text x="24" y="152" class="t l4" xml:space="preserve"><tspan >  </tspan><tspan fill="#56d364" font-weight="700">$429.78</tspan><tspan > total    </tspan><tspan font-weight="700">$17.91</tspan><tspan > </tspan><tspan fill-opacity="0.6">per active day</tspan><tspan >    </tspan><tspan font-weight="700">735.2M</tspan><tspan > </tspan><tspan fill-opacity="0.6">tokens</tspan></text><text x="24" y="172" class="t l5" xml:space="preserve"><tspan >  </tspan><tspan fill="#e3b341">▲</tspan><tspan > </tspan><tspan fill="#e3b341" font-weight="700">$52.49</tspan><tspan > </tspan><tspan fill-opacity="0.6">estimated avoidable (see insights)</tspan></text><text x="24" y="192" class="t l6" xml:space="preserve"></text><text x="24" y="212" class="t l7" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">BY AGENT</tspan></text><text x="24" y="232" class="t l8" xml:space="preserve"><tspan >  Claude Code  </tspan><tspan fill="#6cb6ff">████████████████████████</tspan><tspan >      $405.89  </tspan><tspan fill-opacity="0.6">94%</tspan></text><text x="24" y="252" class="t l9" xml:space="preserve"><tspan >  Codex CLI    </tspan><tspan fill="#e3b341">█</tspan><tspan fill="#e3b341" fill-opacity="0.6">░░░░░░░░░░░░░░░░░░░░░░░</tspan><tspan >       $11.95  </tspan><tspan fill-opacity="0.6">3%</tspan></text><text x="24" y="272" class="t l10" xml:space="preserve"><tspan >  Gemini CLI   </tspan><tspan fill="#56d364">█</tspan><tspan fill="#56d364" fill-opacity="0.6">░░░░░░░░░░░░░░░░░░░░░░░</tspan><tspan >       $11.94  </tspan><tspan fill-opacity="0.6">3%</tspan></text><text x="24" y="292" class="t l11" xml:space="preserve"></text><text x="24" y="312" class="t l12" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">BY MODEL</tspan></text><text x="24" y="332" class="t l13" xml:space="preserve"><tspan fill-opacity="0.6">  model              requests  input+cache  output     cost  share</tspan></text><text x="24" y="352" class="t l14" xml:space="preserve"><tspan >  claude-opus-5-5       3,735       466.3M    3.0M  $348.90    81%</tspan></text><text x="24" y="372" class="t l15" xml:space="preserve"><tspan >  claude-sonnet-5-5       982       117.5M  782.8K   $50.18    12%</tspan></text><text x="24" y="392" class="t l16" xml:space="preserve"><tspan >  gpt-5-codex             407        39.2M  340.1K   $11.95     3%</tspan></text><text x="24" y="412" class="t l17" xml:space="preserve"><tspan >  gemini-2.5-pro          267        25.1M  226.3K   $11.94     3%</tspan></text><text x="24" y="432" class="t l18" xml:space="preserve"><tspan >  claude-haiku-5-5        643        82.3M  471.1K    $6.81     2%</tspan></text><text x="24" y="452" class="t l19" xml:space="preserve"></text><text x="24" y="472" class="t l20" xml:space="preserve"><tspan fill="#39c5cf" font-weight="700">INSIGHTS</tspan></text><text x="24" y="492" class="t l21" xml:space="preserve"><tspan >  </tspan><tspan fill="#e3b341">●</tspan><tspan > </tspan><tspan font-weight="700">$52.49 re-paid rebuilding expired caches</tspan></text><text x="24" y="512" class="t l22" xml:space="preserve"><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan fill-opacity="0.6">69 </tspan><tspan fill-opacity="0.6">requests </tspan><tspan fill-opacity="0.6">came </tspan><tspan fill-opacity="0.6">back </tspan><tspan fill-opacity="0.6">after </tspan><tspan fill-opacity="0.6">the </tspan><tspan fill-opacity="0.6">prompt </tspan><tspan fill-opacity="0.6">cache </tspan><tspan fill-opacity="0.6">expired </tspan><tspan fill-opacity="0.6">and </tspan><tspan fill-opacity="0.6">re-wrote </tspan><tspan fill-opacity="0.6">20K+ </tspan><tspan fill-opacity="0.6">tokens </tspan><tspan fill-opacity="0.6">of </tspan><tspan fill-opacity="0.6">context </tspan><tspan fill-opacity="0.6">at </tspan><tspan fill-opacity="0.6">write </tspan></text><text x="24" y="532" class="t l23" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">price </tspan><tspan fill-opacity="0.6">instead </tspan><tspan fill-opacity="0.6">of </tspan><tspan fill-opacity="0.6">read </tspan><tspan fill-opacity="0.6">price.</tspan></text><text x="24" y="552" class="t l24" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">→ After a long break, start a fresh session or /compact first instead of resuming a huge one.</tspan></text><text x="24" y="572" class="t l25" xml:space="preserve"><tspan >  </tspan><tspan fill="#e3b341">●</tspan><tspan > </tspan><tspan font-weight="700">~$60.26 less if light turns had run on Sonnet</tspan></text><text x="24" y="592" class="t l26" xml:space="preserve"><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan fill-opacity="0.6">1,483 </tspan><tspan fill-opacity="0.6">requests </tspan><tspan fill-opacity="0.6">on </tspan><tspan fill-opacity="0.6">Opus/Fable </tspan><tspan fill-opacity="0.6">($120.52, </tspan><tspan fill-opacity="0.6">35% </tspan><tspan fill-opacity="0.6">of </tspan><tspan fill-opacity="0.6">premium-model </tspan><tspan fill-opacity="0.6">spend) </tspan><tspan fill-opacity="0.6">produced </tspan><tspan fill-opacity="0.6">under </tspan><tspan fill-opacity="0.6">300 </tspan><tspan fill-opacity="0.6">tokens </tspan><tspan fill-opacity="0.6">of </tspan></text><text x="24" y="612" class="t l27" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">output: </tspan><tspan fill-opacity="0.6">tool </tspan><tspan fill-opacity="0.6">calls, </tspan><tspan fill-opacity="0.6">quick </tspan><tspan fill-opacity="0.6">edits, </tspan><tspan fill-opacity="0.6">short </tspan><tspan fill-opacity="0.6">answers.</tspan></text><text x="24" y="632" class="t l28" xml:space="preserve"><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan > </tspan><tspan fill-opacity="0.6">→ </tspan><tspan fill-opacity="0.6">Use </tspan><tspan fill-opacity="0.6">a </tspan><tspan fill-opacity="0.6">lighter </tspan><tspan fill-opacity="0.6">model </tspan><tspan fill-opacity="0.6">(/model </tspan><tspan fill-opacity="0.6">sonnet) </tspan><tspan fill-opacity="0.6">for </tspan><tspan fill-opacity="0.6">routine </tspan><tspan fill-opacity="0.6">edits </tspan><tspan fill-opacity="0.6">and </tspan><tspan fill-opacity="0.6">exploration; </tspan><tspan fill-opacity="0.6">switch </tspan><tspan fill-opacity="0.6">to </tspan><tspan fill-opacity="0.6">Opus </tspan><tspan fill-opacity="0.6">for </tspan><tspan fill-opacity="0.6">planning </tspan></text><text x="24" y="652" class="t l29" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">and </tspan><tspan fill-opacity="0.6">hard </tspan><tspan fill-opacity="0.6">bugs.</tspan></text><text x="24" y="672" class="t l30" xml:space="preserve"><tspan >  </tspan><tspan fill="#e3b341">●</tspan><tspan > </tspan><tspan font-weight="700">39% of spend came from requests carrying 150K+ tokens of context</tspan></text><text x="24" y="692" class="t l31" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">1,680 requests, $168.49. Every turn in a long session re-sends the whole history.</tspan></text><text x="24" y="712" class="t l32" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">→ Use /clear between unrelated tasks and /compact in long ones.</tspan></text><text x="24" y="732" class="t l33" xml:space="preserve"><tspan >  </tspan><tspan fill="#e3b341">●</tspan><tspan > </tspan><tspan font-weight="700">Most expensive session: $15.92 in docs-site</tspan></text><text x="24" y="752" class="t l34" xml:space="preserve"><tspan >    </tspan><tspan fill-opacity="0.6">142 requests on 2026-10-27, mostly claude-opus-5-5.</tspan></text>
